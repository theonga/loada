# ─────────────────────────────────────────────────────────────────────────────
# Loada — NGINX reverse-proxy config
# Place at: /etc/nginx/sites-available/loada
# Enable:   ln -s /etc/nginx/sites-available/loada /etc/nginx/sites-enabled/loada
# Reload:   nginx -t && systemctl reload nginx
#
# DNS records required (all A → EC2 public IP):
#   api.loada.app      — Cloudflare proxied (orange cloud) ✓
#   admin.loada.app    — Cloudflare proxied (orange cloud) ✓
#   socket.loada.app   — Cloudflare DNS-only (grey cloud) ✗  ← WebSocket, no Cloudflare proxy
#
# Ports (all on 127.0.0.1 — not exposed externally):
#   3000  Fastify API  (PM2, 1 instance — Socket.IO requires same process)
#   3001  Admin panel  (PM2, Next.js standalone)
# ─────────────────────────────────────────────────────────────────────────────

# ── API ───────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name api.loada.app;

  # HTTPS redirect — add after certbot runs
  # return 301 https://$host$request_uri;

  location / {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ── Socket.IO (separate subdomain — Cloudflare DNS-only) ──────────────────────
# Socket.IO is served by the same Fastify process on port 3000.
# A dedicated subdomain lets mobile clients bypass Cloudflare's WebSocket limits.
server {
  listen 80;
  server_name socket.loada.app;

  location /socket.io/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 3600s;     # keep WebSocket connections alive
  }
}

# ── Admin panel ───────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name admin.loada.app;

  # Restrict to trusted IPs — uncomment and set your office/VPN CIDR in production
  # allow 203.0.113.0/24;
  # deny  all;

  location / {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Next.js hot-reload WebSocket (dev only — remove in production)
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
  }
}

# ── HTTPS (generated by certbot — do not edit manually) ──────────────────────
# Run: certbot --nginx -d api.loada.app -d admin.loada.app -d socket.loada.app
# Certbot will append SSL server blocks below this line.
